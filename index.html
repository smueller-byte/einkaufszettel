<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Einkaufszettel</title>
<meta name="description" content="Gemeinsamer Einkaufszettel für die Familie">
<meta name="theme-color" content="#F2F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<script>
/* Family key: comes from the link (#f=...) and is remembered on this device. */
(function(){
  var NS = window.EKZ_NS = window.EKZ_NS || 'einkaufszettel';
  var RE = /^[A-Za-z0-9_-]{20,64}$/, m = /[#&]f=([A-Za-z0-9_-]{20,64})/.exec(location.hash), k = m ? m[1] : null, stored = null;
  try { stored = localStorage.getItem(NS + '.family'); } catch (e) {}
  if (k){ try { localStorage.setItem(NS + '.family', k); } catch (e) {} }
  else if (stored && RE.test(stored)){ k = stored; try { history.replaceState(null, '', '#f=' + k); } catch (e) {} }
  window.EKZ_FAMILY = k || null;
  window.ekzDbReady = new Promise(function(resolve){ window.__ekzResolveDb = resolve; });
  setTimeout(function(){ window.EKZ_SYNC_REASON = window.EKZ_SYNC_REASON || 'load'; window.__ekzResolveDb(null); }, 12000);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* Layout: one-screen app. Phone and portrait tablet show one view at a time with a bottom bar
   (Einkaufszettel · raised Hinzufügen · Produktliste); landscape tablet shows Hinzufügen or
   Produktliste on the left and the list on the right. Paper-white list, ballpoint blue for actions,
   price-tag red only for offers, amber only for "Dringend", receipt-style figures. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#E8ECF4;
  --ink:#141B2E; --ink-2:#525C76; --ink-3:#7E879D; --line:#D6DCE8;
  --pen:#2443C4; --on-pen:#FFFFFF; --pen-soft:#E3E8FB;
  --offer:#C3271B; --offer-soft:#FCE6E3;
  --good:#127346; --good-soft:#DDF2E6;
  --warn:#8A5300; --warn-soft:#FBEED2;
  --scrim:rgba(14,18,32,.46);
  --shadow:0 12px 32px rgba(20,27,46,.18);
  --fab-shadow:0 6px 16px rgba(36,67,196,.32);
  --dot-l:46%; --av-l:38%; --av-fg:#FFFFFF;
  --hair:rgba(20,27,46,.08); --card-shadow:0 1px 2px rgba(20,27,46,.06), 0 2px 10px rgba(20,27,46,.045); --upcoming:#ECEEF3;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --surface:#171C2E; --surface-2:#222A42;
    --ink:#EEF1F8; --ink-2:#A9B1C7; --ink-3:#737C96; --line:#2B3352;
    --pen:#93A8FF; --on-pen:#0B1026; --pen-soft:#232D58;
    --offer:#FF8475; --offer-soft:#47211E;
    --good:#63D69E; --good-soft:#15382A;
    --warn:#F0BE5A; --warn-soft:#3B2D10;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 12px 32px rgba(0,0,0,.5);
    --fab-shadow:0 6px 16px rgba(0,0,0,.45);
    --dot-l:64%; --av-l:72%; --av-fg:#0B1026; --hair:rgba(255,255,255,.07); --card-shadow:0 0 0 1px rgba(255,255,255,.06); --upcoming:#1F2539;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171C2E; --surface-2:#222A42;
  --ink:#EEF1F8; --ink-2:#A9B1C7; --ink-3:#737C96; --line:#2B3352;
  --pen:#93A8FF; --on-pen:#0B1026; --pen-soft:#232D58;
  --offer:#FF8475; --offer-soft:#47211E;
  --good:#63D69E; --good-soft:#15382A;
  --warn:#F0BE5A; --warn-soft:#3B2D10;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --fab-shadow:0 6px 16px rgba(0,0,0,.45);
  --dot-l:64%; --av-l:72%; --av-fg:#0B1026; --hair:rgba(255,255,255,.07); --card-shadow:0 0 0 1px rgba(255,255,255,.06); --upcoming:#1F2539;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.35 var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Shell */
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;flex:none}
.brand h1{font:700 21px/1 var(--cond);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2);white-space:nowrap}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.sync[data-s="ok"] .sync-dot{background:var(--good)}
.sync[data-s="saving"] .sync-dot,.sync[data-s="connecting"] .sync-dot{background:var(--pen)}
.sync[data-s="offline"] .sync-dot,.sync[data-s="local"] .sync-dot{background:var(--warn)}
.sync[data-s="error"] .sync-dot{background:var(--offer)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.panes{flex:1;min-height:0;display:flex;position:relative}
.pane{flex:1;min-width:0;min-height:0;display:none;flex-direction:column}
.app[data-tab="add"] .pane-add,.app[data-tab="list"] .pane-list,.app[data-tab="products"] .pane-products{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:4px;padding-bottom:28px}

/* Bottom bar */
.tabs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;border-top:1px solid var(--line);background:var(--surface);padding-block:6px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border-radius:14px;color:var(--ink-2);font-size:14px;font-weight:500;text-align:center}
.tab[aria-current="page"]{color:var(--pen);font-weight:600}
.tab[aria-current="page"] .tab-ic{background:var(--pen-soft)}
.tab-ic{position:relative;display:grid;place-items:center;width:56px;height:30px;border-radius:15px}
.badge{position:absolute;top:-5px;right:4px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pen);color:var(--on-pen);font:600 12px/20px var(--mono);text-align:center}
.fab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 6px;font-size:14px;font-weight:600;color:var(--pen)}
.fab-c{width:58px;height:48px;border-radius:16px;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;box-shadow:var(--fab-shadow);transition:transform .12s}
.fab:active .fab-c{transform:scale(.95)}

/* Search */
.search{position:relative;padding-block:4px 8px}
.search-box{position:relative;display:flex;align-items:center}
.search-ic{position:absolute;left:16px;color:var(--ink-3);pointer-events:none;display:grid}
.search-box input{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 50px 0 48px;font-size:18px;outline:none;-webkit-appearance:none;appearance:none}
.search-box input::placeholder{color:var(--ink-3)}
.search-box input:focus{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.search-box input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:4px;width:46px;height:46px;display:grid;place-items:center;color:var(--ink-2);border-radius:50%}

/* Section labels and groups */
.sec{font:600 13px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:18px 4px 8px}
.sec:first-child{margin-top:6px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.note{color:var(--ink-2);font-size:16px;margin:10px 4px}

/* Product rows (add pane and product list) */
.sug{display:flex;align-items:stretch;min-height:62px;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 4px 10px 16px}
.sug-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sug-name{font-weight:500;overflow-wrap:anywhere}
.sug-meta{font-size:15px;color:var(--ink-2);overflow-wrap:anywhere}
.sug-meta.need{color:var(--pen);font-weight:500}
.sug .price{font-size:16px;color:var(--ink-2)}
.sug.on .sug-name{color:var(--pen)}
.plus{flex:0 0 56px;display:grid;place-items:center}
.plus-c{width:36px;height:36px;border-radius:50%;background:var(--pen-soft);color:var(--pen);display:grid;place-items:center}
.plus-c.on{background:var(--pen);color:var(--on-pen)}
.stepper{display:flex;align-items:center;padding-right:6px;flex:none}
.stepper button{width:44px;height:44px;display:grid;place-items:center}
.stepper .st-c{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.stepper .st-n{min-width:26px;text-align:center;font:600 17px var(--mono)}
.sug.create .sug-name{color:var(--pen);font-weight:600}

/* Just-added card */
.added{background:var(--pen-soft);border-radius:16px;padding:12px;margin-bottom:6px;display:flex;flex-direction:column;gap:10px}
.added-top{display:flex;align-items:center;gap:12px}
.added-ic{width:30px;height:30px;border-radius:50%;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;flex:none}
.added-t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.added-top .price{color:var(--ink-2);font-size:16px}
.added-row{display:flex;flex-wrap:wrap;gap:8px}
.added-row .tagbtn{background:var(--surface)}
.added-row .more-btn{margin-left:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;font-weight:600;font-size:16px;text-align:center;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primary.idle{background:var(--surface-2);border-color:var(--surface-2);color:var(--ink-2)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.danger{color:var(--offer)}
.btn.block{width:100%}

/* Tag toggles and pills */
.tagbtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:16px}
.tagbtn[data-tag="urgent"][aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.tagbtn[data-tag="offerOnly"][aria-pressed="true"]{border-color:var(--offer);background:var(--offer-soft);color:var(--offer);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 13px/1 var(--font);padding:5px 8px;border-radius:7px;white-space:nowrap}
.pill.urgent{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.off{background:var(--offer-soft);color:var(--offer)}

/* Empty states */
.empty{text-align:center;padding:44px 12px 20px;color:var(--ink-2);max-width:32ch;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px}
.empty-ic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--pen)}
.empty-t{font:700 20px/1.2 var(--cond);color:var(--ink);text-wrap:balance}
.only-tabs{margin-top:8px}

/* Shopping list */
.store{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.store.drop-hot{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.store.deal{border:1.5px solid var(--offer-soft)}
.store-h{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px dashed var(--line)}
.store-h h3{flex:1;font:700 17px/1.15 var(--cond);letter-spacing:.07em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.store.deal .store-h h3{color:var(--offer)}
.store-sum{font-weight:600;font-size:16px}
.dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--h,222) 62% var(--dot-l));flex:none}
.dot.none{background:transparent;border:2px dashed var(--ink-3)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h,262) 58% var(--av-l));color:var(--av-fg);font:700 14px/1 var(--font);letter-spacing:.02em;flex:none}
.av.lg{width:40px;height:40px;font-size:18px}
.row.done .av{opacity:.45}
.me-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.srow .inp.short{flex:0 0 74px;padding:0 10px}
.srow .inp.short input{text-transform:uppercase;text-align:center;font-weight:600}
.deal-ic{color:var(--offer);display:grid;flex:none}
.row{display:flex;align-items:stretch;min-height:62px;border-top:1px solid var(--line);background:var(--surface)}
.rows .row:first-child{border-top:0}
.check{flex:0 0 54px;display:grid;place-items:center}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.row.done .box{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.row-name{font-weight:500;overflow-wrap:anywhere}
.qty{font:600 16px var(--mono);color:var(--pen);margin-right:2px}
.row-sub{font-size:15px;color:var(--ink-2);overflow-wrap:anywhere}
.row-price{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:16px}
.row-price .was{font-size:13px;color:var(--ink-3);text-decoration:line-through}
.row-price .now-offer{color:var(--offer);font-weight:600}
.row-price .muted{color:var(--ink-3)}
.tag{font:600 11px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;background:var(--offer-soft);color:var(--offer);padding:4px 6px;border-radius:5px}
.row.done .row-name{text-decoration:line-through;color:var(--ink-3)}
.row.done .qty,.row.done .row-price,.row.done .row-sub,.row.done .now-offer{color:var(--ink-3)}
.row.done .pills{display:none}
.grip{flex:0 0 44px;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab}
.row.dragging{opacity:.35}
.row.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border:1.5px solid var(--pen);border-radius:14px;box-shadow:var(--shadow);opacity:.97}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}

/* Total bar */
.total{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);background:var(--bg);padding-block:10px}
.total-l{flex:1;min-width:0;display:flex;flex-direction:column}
.total-k{font:600 12px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.total-v{font-size:22px;font-weight:600;line-height:1.2}

/* Product list tools */
.ptools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.seg-mini{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:12px;padding:3px}
.seg-mini button{min-height:40px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:500;color:var(--ink-2)}
.seg-mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,27,46,.12)}

/* Drop dock while dragging */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
.dock-k{font:600 12px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:8px}
.dock-chips{display:flex;flex-wrap:wrap;gap:8px}
.drop-chip{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px dashed var(--ink-3);font-weight:600}
.drop-chip.drop-hot{border-style:solid;border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}

/* Sheets */
.backdrop{position:fixed;left:0;right:0;top:0;bottom:var(--kb,0px);z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:580px;max-height:calc(100% - 28px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));outline:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.sheet-head h2{flex:1;min-width:0;font:700 22px/1.2 var(--cond);overflow-wrap:anywhere;text-wrap:balance;padding-top:8px}
.sheet-sub{color:var(--ink-2);font-size:16px;margin-bottom:6px}
.field{margin-top:18px}
.label{display:block;font:600 13px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;max-width:100%}
.chip.sel{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);font-weight:600}
.chip.add{border-style:dashed;color:var(--ink-2)}
.chip-t{overflow-wrap:anywhere}
.chip-p{font:500 14px var(--mono);color:var(--ink-2)}
.chip.sel .chip-p{color:var(--pen)}
.chip-ck{display:grid;width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-3);place-items:center;color:transparent;flex:none}
.chip.sel .chip-ck{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.chip-input{padding:0 6px 0 12px;gap:4px}
.chip-input input{border:0;background:transparent;outline:none;width:11em;min-width:0;height:44px}
.chip-input button{min-height:40px;padding:0 12px;border-radius:10px;background:var(--pen);color:var(--on-pen);font-weight:600;font-size:15px}
.qty-row{display:flex;align-items:center;gap:6px}
.qty-row button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center}
.qty-row .q-n{min-width:56px;text-align:center;font:600 22px var(--mono)}
.inp{display:flex;align-items:center;gap:8px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;min-width:0}

.sync-box{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--ink-2)}
.sync-box b{color:var(--ink);font-weight:600}

/* Toast */
.toast{position:absolute;left:16px;right:16px;bottom:12px;z-index:30;margin:0 auto;max-width:520px;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:var(--shadow);font-size:15px}

function stepperHtml(id, qty, name){
  return '<div class="stepper"><button data-act="dec" data-id="' + id + '" aria-label="' + esc(name) + ': eins weniger"><span class="st-c">' + ICON.minus + '</span></button>' +
    '<span class="st-n">' + qty + '</span>' +
    '<button data-act="inc" data-id="' + id + '" aria-label="' + esc(name) + ': eins mehr"><span class="st-c">' + ICON.plus + '</span></button></div>';
}
function tagButtons(id, it){
  return '<button class="tagbtn" data-act="tag" data-tag="urgent" data-id="' + id + '" aria-pressed="' + (!!it.urgent) + '">' + ICON.bolt + 'Dringend</button>' +
    '<button class="tagbtn" data-act="tag" data-tag="offerOnly" data-id="' + id + '" aria-pressed="' + (!!it.offerOnly) + '">' + ICON.pct + 'Nur im Angebot</button>';
}
function storeDot(s){ return s.hue == null ? '<span class="dot none"></span>' : '<span class="dot" style="--h:' + s.hue + '"></span>'; }
function searchMatches(q){
  var toks = fold(q).split(/\s+/).filter(Boolean), fq = fold(q.trim());
  var out = [];
  Object.keys(S.catalog).forEach(function(pid){
    var p = S.catalog[pid], n = fold(p.name), g = fold(p.group), hay = n + ' ' + g;
    if (!toks.every(function(t){ return hay.indexOf(t) >= 0; })) return;
    var rank = n.indexOf(fq) === 0 ? 0 : (g.indexOf(fq) === 0 ? 1 : ((' ' + n).indexOf(' ' + toks[0]) >= 0 ? 2 : 3));
    out.push({pid:pid, p:p, rank:rank});
  });
  out.sort(function(a, b){ return (b.p.count || 0) - (a.p.count || 0) || a.rank - b.rank || cmpName(a.p.name, b.p.name); });
  return out;
}

/* ---------- render: shopping list ---------- */
function rowHtml(id, it, deal){
  var pi = priceInfo(it), qty = it.qty || 1, ch = cheaper(it), pills = [], price, sub = '';
  if (it.urgent) pills.push('<span class="pill urgent">' + ICON.bolt + 'Dringend</span>');
  if (deal && it.sid && S.stores[it.sid]) sub = '<span class="row-sub">' + esc(S.stores[it.sid].name) + '</span>';
  if (ch) pills.push('<span class="pill good">' + esc(ch.name) + ' −' + fmt(ch.diff) + '</span>');
  var up = isUpcoming(it);
  if (up && pi.offer) pills.unshift('<span class="pill soon">' + ICON.clock + 'ab ' + esc(fmtDay(it.offer.from)) + '</span>');
  if (pi.elsewhere) pills.push('<span class="pill off">Angebot ' + esc(pi.elsewhere.name) + (up ? ' ab ' + esc(fmtDay(it.offer.from)) : '') + '</span>');
  if (pi.unit == null) price = '<span class="muted">–</span>';
  else if (deal) price = '<span class="muted">' + fmt(pi.unit) + '</span>';
  else if (pi.offer) price = '<span class="tag">Angebot</span><span class="now-offer">' + fmt(pi.unit) + '</span>' + (pi.usual != null && pi.usual !== pi.unit ? '<span class="was">' + fmt(pi.usual) + '</span>' : '');
  else price = '<span>' + fmt(pi.unit) + '</span>';

  return '<div class="row' + (it.done ? ' done' : '') + (up && !it.done ? ' upcoming' : '') + '" data-key="' + id + '" data-id="' + id + '">' +
    '<button class="check" data-act="toggle" data-id="' + id + '" aria-pressed="' + (it.done ? 'true' : 'false') + '" aria-label="' + esc(name) + (it.done ? ' zurückholen' : ' abhaken') + '"><span class="box">' + ICON.check + '</span></button>' +
    '<button class="row-main" data-act="edit" data-id="' + id + '">' +
      '<span class="row-text"><span class="row-name">' + (qty > 1 ? '<span class="qty">' + qty + '×</span> ' : '') + esc(name) + '</span>' + sub +
      (pills.length ? '<span class="pills">' + pills.join('') + '</span>' : '') + '</span>' +
      (it.by && Object.keys(S.profiles).length > 1 ? avHtml(it.by) : '') +
      '<span class="row-price price">' + price + '</span>' +
    '</button>' +
    '<button class="grip" data-act="move" data-id="' + id + '" aria-label="' + esc(name) + ' verschieben">' + ICON.grip + '</button>' +
  '</div>';
}
function sumOf(items){
  var sum = 0, missing = 0;
  items.forEach(function(x){ var pi = priceInfo(x.it); if (pi.unit == null) missing++; else sum += pi.unit * (x.it.qty || 1); });
  return {sum:sum, missing:missing};
}
function countChip(g){
  var open = g.filter(function(x){ return !x.it.done; }).length;
  return open ? '<span class="store-n" aria-label="' + open + ' offen">' + open + '</span>' : '<span class="store-n all" aria-label="alles erledigt">' + ICON.checkS + '</span>';
}
function sortRows(g){

  var done = g.filter(function(x){ return x.it.done; }).sort(function(a, b){ return (a.it.doneAt || 0) - (b.it.doneAt || 0); });
  return open.concat(done);
}

const cfg = window.EKZ_SUPABASE || {};
const fam = window.EKZ_FAMILY;
const configured = cfg.url && cfg.anonKey && !/HIER/.test(String(cfg.url) + String(cfg.anonKey));
const COLLS = ['stores', 'catalog', 'list', 'profiles'];
function mapErr(e){
  const c = String((e && e.code) || '');
  if (c === '42501' || c === 'PGRST202' || c === 'PGRST301' || c === '42883') return 'not_granted';
  if (c === '22023' || c === '23514' || c === '23502' || c === '22P02') return 'invalid_argument';
  return 'unavailable';
}
if (!fam){ window.__ekzResolveDb(null); }
else if (!configured){ window.EKZ_SYNC_REASON = 'config'; window.__ekzResolveDb(null); }
else {
  try {
    const { createClient } = await import(SB_JS);
    const sb = createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    const listeners = {};
    let pulling = false, again = false, pullTimer = null, pingTimer = null;

    async function pull(){
      if (pulling){ again = true; return; }
      pulling = true;
      try {
        const { data, error } = await sb.rpc('ekz_pull', { fam });
        if (error){
          const code = mapErr(error);
          COLLS.forEach(c => (listeners[c] || []).forEach(l => l.err && l.err({ code, message: error.message })));
          return;
        }
        const by = {}; COLLS.forEach(c => { by[c] = []; });
        (data || []).forEach(r => { if (by[r.coll]) by[r.coll].push({ id: r.id, data: () => r.data }); });
        COLLS.forEach(c => (listeners[c] || []).forEach(l => l.next({ docs: by[c], size: by[c].length, metadata: { fromCache: false, hasPendingWrites: false } })));
      } catch (e) {
        COLLS.forEach(c => (listeners[c] || []).forEach(l => l.err && l.err({ code: 'unavailable', message: String(e) })));
      } finally {
        pulling = false;
        if (again){ again = false; schedulePull(50); }
      }
    }
    function schedulePull(ms){ clearTimeout(pullTimer); pullTimer = setTimeout(pull, ms || 0); }

    const channel = sb.channel('ekz-' + fam, { config: { broadcast: { self: false } } });
    channel.on('broadcast', { event: 'changed' }, () => schedulePull(150));
    channel.subscribe(status => { if (status === 'SUBSCRIBED') schedulePull(0); });
    function ping(){
      clearTimeout(pingTimer);
      pingTimer = setTimeout(() => { try { Promise.resolve(channel.send({ type: 'broadcast', event: 'changed', payload: {} })).catch(() => {}); } catch (e) {} }, 120);
    }
    async function call(fn, args){
      let res;
      try { res = await sb.rpc(fn, args); } catch (e) { throw { code: 'unavailable', message: String(e) }; }
      if (res.error) throw { code: mapErr(res.error), message: res.error.message };
      ping();
    }

    setInterval(() => { if (document.visibilityState === 'visible') schedulePull(0); }, 15000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') schedulePull(0); });
    window.addEventListener('online', () => schedulePull(0));

    window.__ekzResolveDb({
      doc(path){
        const i = path.indexOf('/'), coll = path.slice(0, i), id = path.slice(i + 1);
        return {
          set: d => call('ekz_put', { fam, p_coll: coll, p_id: id, p_data: d }),
          delete: () => call('ekz_del', { fam, p_coll: coll, p_id: id })
        };
      },
      collection(c){
        const q = {
          limit(){ return q; },
          onSnapshot(next, err){
            const l = { next, err };
            (listeners[c] = listeners[c] || []).push(l);
            schedulePull(0);
            return () => { listeners[c] = (listeners[c] || []).filter(x => x !== l); };
          }
        };
        return q;
      }
    });
  } catch (e) {
    console.error(e);
    window.EKZ_SYNC_REASON = 'load';
    window.__ekzResolveDb(null);
  }
}
</script>
